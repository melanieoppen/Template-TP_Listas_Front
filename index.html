<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <!-- Para el form para agregar comida -->
       <form id="formulario">
        <label for="nombrecomida">Nombre de la comida</label>
        <input type="text" name="nombrecomida" placeholder="Ingrese comida">
        <label for="nombrecategoria">Categoria</label>
        <input type="text" name="categoria" placeholder="Categoria">
        <label for="nombreprovincia">provincia</label>
        <input type="text" name="provincia" placeholder="De que provincia viene">
        <label for="ingredientes">Ingredientes</label>
        <input type="text" name="ingredientes" placeholder="Cuales son sus ingredientes">
        <button type="submit">Siguiente</button>
       </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
