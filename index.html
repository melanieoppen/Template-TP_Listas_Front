<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="filtros">
      <input type="search" class="buscador" id="buscador" placeholder="Buscar por nombre de comida">
      <!-- Para filtros y navegacion -->
      <select class="elegirFiltro" id="filtroCategoria">
       <option value="">Todas las categorías</option>
       <option value="Horno">Horno</option>
       <option value="Parrilla">Parrilla</option>
       <option value="Frito">Frito</option>
       <option value="Guiso">Guiso</option>
      </select>
      <select class="elegirFiltro" id="filtroProvincia">
        <option value="">Todas las provincias</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Salta">Salta</option>
        <option value="Jujuy">Jujuy</option>
        <option value="Córdoba">Córdoba</option>
        <option value="Tucumán">Tucumán</option>
        <option value="Entre Ríos">Entre Ríos</option>
        <option value="Santa Fe">Santa Fe</option>
       </select>
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <h1 class="tituloform">Agregar comida</h1>
      <!-- Para el form para agregar comida -->
       <form id="agregarComidaForm">
        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" placeholder="Ingrese comida">

        <label for="categoria">Categoria</label>
        <input type="text" name="categoria" placeholder="Categoria">

        <label for="provincia">Provincia</label>
        <input type="text" name="provincia" placeholder="De que provincia viene">

        <label for="ingredientes">Ingredientes (separados por comas)</label>
        <input type="text" name="ingredientes" placeholder="Cuales son sus ingredientes">

        <button type="submit">Agregar</button>
       </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
