<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="filtros">
      <input type="search" class="buscador" id="buscador" placeholder="Buscar por nombre de comida">
      <!-- Para filtros y navegacion -->
      <select class="elegirFiltro" id="filtroCategoria">
       <option value="">Todas las categorías</option>
      </select>

      <select class="elegirFiltro" id="filtroProvincia">
        <option value="">Todas las provincias</option>
       </select>
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <h1 class="tituloform">Agregar comida</h1>
      <!-- Para el form para agregar comida -->
       <form class="formulario" id="agregarComidaForm">
        <label for="nombre">Nombre de la comida</label>
        <input type="text" id="nombre" placeholder="Ingrese comida">

        <label for="categoria">Categoria</label>
        <input type="text" name="categoria" placeholder="Categoria">

        <label for="provincia">Provincia</label>
        <input type="text" name="provincia" placeholder="De que provincia viene">

        <div class="contenedor-ingredientes">
          <label for="ingredientes">Ingredientes (separados por comas)</label>
          <input type="text" class="ingrediente" placeholder="Ingredientes">
        </div>
        <button type="button" id="agregarIngrediente" class="botoningredientes">Nuevo ingrediente</button>

        <button type="submit">Agregar</button>
       </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
